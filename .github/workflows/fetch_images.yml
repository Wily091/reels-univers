name: Télécharger des images officielles (NASA)

# Déclenché en modifiant tools/IMAGES.json : télécharge chaque image absente de assets/images/ (id NASA « PIA… » ou urls).
on:
  push:
    branches: [main]
    paths: ['tools/IMAGES.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Téléchargement
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          bad = []
          for im in json.load(open('tools/IMAGES.json'))['images']:
              f, i = im['file'], im.get('id')
              if os.path.exists(f) and os.path.getsize(f) > 20000:
                  continue
              os.makedirs(os.path.dirname(f), exist_ok=True)
              urls = list(im.get('urls') or [])
              if i and i.startswith('PIA'):
                  urls += [f"https://photojournal.jpl.nasa.gov/jpeg/{i}.jpg",
                           f"https://images-assets.nasa.gov/image/{i}/{i}~orig.jpg",
                           f"https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia{i[3:6]}xx/pia{i[3:]}/{i}.jpg"]
              elif i:
                  urls += [f"https://images-assets.nasa.gov/image/{i}/{i}~orig.jpg", f"https://images-assets.nasa.gov/image/{i}/{i}~large.jpg"]
              ok = False
              for u in urls:
                  r = subprocess.run(['curl', '-sSLf', '-m', '180', '-A', 'Mozilla/5.0', '-o', f, u])
                  if r.returncode == 0 and os.path.getsize(f) > 20000:
                      print('OK', f, u, os.path.getsize(f)); ok = True; break
                  print('échec', u)
              if not ok:
                  bad.append(f"{f} ({i})")
                  if os.path.exists(f): os.remove(f)
          for b in bad: print(f"::warning title=Image non téléchargée::{b}")
          open('/tmp/bad', 'w').write('\n'.join(bad))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/images && git commit -m "Images officielles téléchargées" && git push || echo "Rien de nouveau"
          [ ! -s /tmp/bad ]
