name: Rendu du reel

# DA « planche de notes » (docs/STYLE_PLANCHE.md). Déclenché quand un épisode arrive dans episodes/<nom>/
# (la tâche quotidienne y déplace 2 épisodes du stock : <date>-12h et <date>-19h). Chaque épisode modifié est rendu,
# puis publié en release « ep-<nom> » (reel.mp4, cover.jpg, meta.json). Voix STOCKÉE uniquement : aucun crédit ElevenLabs.
on:
  push:
    branches: [main]
    paths: ['episodes/*/episode.json']
  workflow_dispatch:
    inputs:
      episode:
        description: "Dossier de l'épisode (ex. episodes/2026-11-17-12h)"
        required: true

permissions:
  contents: write

concurrency:
  group: rendu-reel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Trouver les épisodes
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            EPS="${{ github.event.inputs.episode }}"
          else
            EPS=$(git diff --name-only --diff-filter=AMR HEAD~1 HEAD | grep -E '^episodes/[^/]+/episode\.json$' | xargs -r -n1 dirname | sort -u | tr '\n' ' ')
          fi
          [ -n "$EPS" ] || { echo "Aucun épisode modifié"; exit 1; }
          echo "list=$EPS" >> "$GITHUB_OUTPUT"
          echo "Épisodes : $EPS"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dépendances
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet numpy

      - name: Rendu, mixage, contrôle du son et publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for EP in ${{ steps.ep.outputs.list }}; do
            echo "::group::$EP"
            bash engine/build.sh "$EP" --stored-only
            NAME=$(basename "$EP"); TAG="ep-$NAME"; B="$EP/build"
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" "$B/reel.mp4" "$B/cover.jpg" "$B/meta.json" \
              --title "Épisode $NAME" \
              --notes "$(python3 -c "import json;print(json.load(open('$EP/episode.json'))['title'])")"
            echo "Vidéo : https://github.com/${{ github.repository }}/releases/download/$TAG/reel.mp4"
            echo "::endgroup::"
          done
